name: Ändra inställningar

# Fliken Actions → Ändra inställningar → Run workflow ger ett formulär.
# Fält du lämnar tomma (eller på "behåll") ändras inte.
on:
  workflow_dispatch:
    inputs:
      omraden:
        description: "Sökområden, kommaseparerade (t.ex: Uppsala, Norrtälje, Knivsta)"
        required: false
        type: string
      maxPris:
        description: "Maxpris i kr (0 = inget pristak)"
        required: false
        type: string
      maxHallplats:
        description: "Max meter till närmaste hållplats"
        required: false
        type: string
      maxVatten:
        description: "Max meter till vatten"
        required: false
        type: string
      maxSkog:
        description: "Max meter till skog"
        required: false
        type: string
      maxGrannar:
        description: "Max antal grannbyggnader inom 300 m"
        required: false
        type: string
      kravNatur:
        description: "Kräv vatten ELLER skog nära?"
        required: false
        type: choice
        options: ["behåll", "ja", "nej"]
        default: "behåll"
      endastTraffar:
        description: "Notiser endast för hus som uppfyller alla krav?"
        required: false
        type: choice
        options: ["behåll", "ja", "nej"]
        default: "behåll"
      # Hela kriterieuppsättningen som JSON, i ett svep – de handskrivna
      # fälten ovan täcker inte hustyp, rum, ytor eller restid, och GitHub
      # tillåter bara tio inputs totalt. Lämna tomt när du fyller i
      # formuläret för hand. Täcker även hushall (nettoinkomstManad,
      # kontantinsatsTillgangligt, ovrigaLanManad, antagande, nuvarandeBostad)
      # – den enda validerade vägen dit, se uppdatera-config.js.
      json:
        description: 'Kriterier/hushall som JSON, t.ex. {"kriterier":{"maxPris":4000000},"hushall":{"nettoinkomstManad":45000}}'
        required: false
        type: string

jobs:
  uppdatera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: matthewholm/bostadsvakt-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Uppdatera config.json
        env:
          OMRADEN: ${{ inputs.omraden }}
          MAX_PRIS: ${{ inputs.maxPris }}
          MAX_HALLPLATS: ${{ inputs.maxHallplats }}
          MAX_VATTEN: ${{ inputs.maxVatten }}
          MAX_SKOG: ${{ inputs.maxSkog }}
          MAX_GRANNAR: ${{ inputs.maxGrannar }}
          KRAV_NATUR: ${{ inputs.kravNatur == 'behåll' && '' || inputs.kravNatur }}
          ENDAST_TRAFFAR: ${{ inputs.endastTraffar == 'behåll' && '' || inputs.endastTraffar }}
          KRITERIER_JSON: ${{ inputs.json }}
        run: node src/uppdatera-config.js

      - name: Visa resultat i sammanfattningen
        run: |
          echo "## Aktuella inställningar" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat data-repo/config.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Committa ändringen i bostadsvakt-data
        working-directory: data-repo
        run: |
          if ! git diff --quiet config.json; then
            git config user.name "bostadsvakt-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config.json
            git commit -m "Ändra inställningar via formulär"
            git pull --rebase
            git push
          else
            echo "Inga ändringar."
          fi
