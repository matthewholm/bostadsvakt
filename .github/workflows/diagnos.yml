name: Diagnos resa

# Engångsverktyg för att verifiera förbeställnings-/operatörsvarningarna mot
# skarp ResRobot-data. Tas bort igen efter verifiering.
on:
  workflow_dispatch:
    inputs:
      adress:
        description: "Adress att slå upp"
        required: false
        type: string
        default: "Undravägen 39, Norrtälje"

jobs:
  diagnos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kör diagnos
        env:
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          DIAGNOS_ADRESS: ${{ inputs.adress }}
        run: node src/diagnos-resa.mjs "$DIAGNOS_ADRESS"
