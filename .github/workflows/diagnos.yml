name: Diagnos resa

# Engångsverktyg för att felsöka varför resaTillStockholm gav null för ett
# specifikt hus. Tas bort igen efter felsökningen.
on:
  workflow_dispatch:
    inputs:
      lat:
        description: "Latitud"
        required: false
        type: string
        default: "59.7721143"
      lon:
        description: "Longitud"
        required: false
        type: string
        default: "18.2379921"

jobs:
  diagnos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Kör diagnos
        env:
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          DIAGNOS_LAT: ${{ inputs.lat }}
          DIAGNOS_LON: ${{ inputs.lon }}
        run: node src/diagnos-resa.mjs "$DIAGNOS_LAT" "$DIAGNOS_LON"
