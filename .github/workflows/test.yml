name: Testa Bostadsvakt

# Körs bara manuellt: fliken Actions → Testa Bostadsvakt → Run workflow.
# Testar hela kedjan (hållplats, natur, notis) med ett låtsashus –
# fungerar även innan alla API-nycklar är på plats.
on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Nätfria enhetstester: län/biljettlogik, geokodningsspärren och
      # matchningens redovisning. Kräver varken nycklar eller internet, så de
      # kan köras först och fånga logikfel innan de riktiga anropen görs.
      - name: Kör enhetstester
        run: npm test

      - name: Kör testläge
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js --test
