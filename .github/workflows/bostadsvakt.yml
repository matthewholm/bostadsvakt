name: Bostadsvakt

on:
  schedule:
    # Var 30:e minut, kl 06–21 svensk tid (04–19 UTC sommartid)
    - cron: "*/30 4-19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Kör bostadsvakten
        env:
          BOOLI_CALLER_ID: ${{ secrets.BOOLI_CALLER_ID }}
          BOOLI_PRIVATE_KEY: ${{ secrets.BOOLI_PRIVATE_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js

      - name: Spara sedda annonser och träffar
        run: |
          cp data/traffar.json /tmp/mina-traffar.json
          cp data/seen.json /tmp/mina-seen.json
          cp data/slutpriser.json /tmp/mina-slutpriser.json
          git config user.name "bostadsvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node src/merge.js /tmp/mina-traffar.json /tmp/mina-seen.json /tmp/mina-slutpriser.json
            git add data/
            if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
            git commit -m "Uppdatera sedda annonser och träffar"
            if git push; then echo "Sparat."; exit 0; fi
            echo "Push avvisad (försök $i) – hämtar senaste och slår ihop igen."
            sleep 3
          done
          echo "Kunde inte spara efter flera försök."; exit 1

      - name: Larm om körningen misslyckades
        if: failure()
        env:
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
        run: |
          if [ -n "${HA_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "$HA_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Bostadsvakt: körningen misslyckades\",\"message\":\"En körning gick fel. Kolla loggen: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              > /dev/null
          fi
