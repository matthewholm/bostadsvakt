name: Bostadsvakt

on:
  schedule:
    # Var 30:e minut, kl 06–21 svensk tid (04–19 UTC sommartid)
    - cron: "*/30 4-19 * * *"
  workflow_dispatch: {}
  # Text som klistrats in på ett hus i Alva ("Skicka till källan" på en
  # extern koppling). Alva skickar { item_id, text } som client_payload,
  # där item_id är husets id ur sida.json. Se index.js, INMATNING_FIL.
  repository_dispatch:
    types: [alva_text]

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  # home-vm kör samma motor var 30:e minut (drift/, README "Köra på home-vm")
  # och skriver data/drift.json i bostadsvakt-data efter varje lyckad
  # körning. Har den kört inom 45 minuter hoppar schemat över sin tur, så att
  # samma nya hus inte notifieras två gånger. Slutar home-vm att köra tar
  # schemat över av sig självt. Knappen, Alva och klistra-sidan påverkas inte.
  vakt:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      hoppa: ${{ steps.koll.outputs.hoppa }}
    steps:
      - name: Har home-vm kört nyss?
        id: koll
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          url=repos/matthewholm/bostadsvakt-data/contents/data/drift.json
          # Saknas filen skriver gh api felet på stdout, därför räknas bara
          # en giltig tidsstämpel.
          senaste=$(gh api "$url" -H "Accept: application/vnd.github.raw" --jq ".senasteKorning // empty" 2>/dev/null) || senaste=""
          giltig='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if [[ "$senaste" =~ $giltig ]] && [ $(( $(date +%s) - $(date -d "$senaste" +%s) )) -lt 2700 ]; then
            echo "home-vm körde $senaste, schemat hoppar över den här gången."
            echo "hoppa=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ingen körning från home-vm senaste 45 minuterna (${senaste:-aldrig}), GitHub kör."
          fi

  bevaka:
    needs: vakt
    # vakt hoppas över för knappen, Alva och klistra-sidan, därför !cancelled().
    if: ${{ !cancelled() && needs.vakt.outputs.hoppa != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kriterier, hushållets ekonomi och husflödet bor i ett separat privat
      # repo, inte här – det här repot är (eller blir) publikt, och config.json
      # var på väg att bära en hel familjs inkomst och sparande. Se
      # bostadsvakt-data/README.md. `data-repo`-token är en fine-grained PAT
      # scopad bara till det repot (Contents: read/write).
      - uses: actions/checkout@v5
        with:
          repository: matthewholm/bostadsvakt-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Bara Chromium behövs (maklarkalkyl.js), inte Firefox/WebKit som
      # playwright install annars laddar ner i onödan.
      - run: npx playwright install --with-deps chromium

      # Texten från Alva läggs utanför data-repo/, så att den aldrig kan
      # råka committas med resten av datan. Via env och toJSON, aldrig
      # inklistrad i skriptet, så att texten inte kan bli kod.
      - name: Spara texten från Alva
        if: github.event_name == 'repository_dispatch'
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: printf '%s' "$PAYLOAD" > "$RUNNER_TEMP/inmatning.json"

      - name: Kör bostadsvakten
        env:
          INMATNING_FIL: ${{ github.event_name == 'repository_dispatch' && format('{0}/inmatning.json', runner.temp) || '' }}
          BOOLI_CALLER_ID: ${{ secrets.BOOLI_CALLER_ID }}
          BOOLI_PRIVATE_KEY: ${{ secrets.BOOLI_PRIVATE_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js

      # Samma spara-loop som home-vm kör, se drift/spara.sh.
      - name: Spara sedda annonser och träffar i bostadsvakt-data
        working-directory: data-repo
        run: bash ../drift/spara.sh

      - name: Larm om körningen misslyckades
        if: failure()
        env:
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${HA_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "$HA_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Bostadsvakt: körningen misslyckades\",\"message\":\"En körning gick fel. Kolla loggen: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              > /dev/null
          fi
