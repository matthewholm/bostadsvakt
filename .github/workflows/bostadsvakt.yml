name: Bostadsvakt

on:
  schedule:
    # Var 30:e minut, kl 06–21 svensk tid (04–19 UTC sommartid)
    - cron: "*/30 4-19 * * *"
  workflow_dispatch: {}

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kriterier, hushållets ekonomi och husflödet bor i ett separat privat
      # repo, inte här – det här repot är (eller blir) publikt, och config.json
      # var på väg att bära en hel familjs inkomst och sparande. Se
      # bostadsvakt-data/README.md. `data-repo`-token är en fine-grained PAT
      # scopad bara till det repot (Contents: read/write).
      - uses: actions/checkout@v5
        with:
          repository: matthewholm/bostadsvakt-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Bara Chromium behövs (maklarkalkyl.js), inte Firefox/WebKit som
      # playwright install annars laddar ner i onödan.
      - run: npx playwright install --with-deps chromium

      - name: Kör bostadsvakten
        env:
          BOOLI_CALLER_ID: ${{ secrets.BOOLI_CALLER_ID }}
          BOOLI_PRIVATE_KEY: ${{ secrets.BOOLI_PRIVATE_KEY }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js

      - name: Spara sedda annonser och träffar i bostadsvakt-data
        working-directory: data-repo
        run: |
          cp data/traffar.json /tmp/mina-traffar.json
          cp data/seen.json /tmp/mina-seen.json
          cp data/slutpriser.json /tmp/mina-slutpriser.json
          # En importfil (se index.js) läses en gång – den här körningen har
          # läst den, så den tas bort när resultatet sparas.
          if [ -f data/import.html ]; then touch /tmp/import-last; fi
          git config user.name "bostadsvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node ../src/merge.js /tmp/mina-traffar.json /tmp/mina-seen.json /tmp/mina-slutpriser.json
            node ../src/sida.js
            if [ -f /tmp/import-last ]; then git rm -q --ignore-unmatch data/import.html; fi
            git add data/
            if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
            git commit -m "Uppdatera sedda annonser och träffar"
            if git push; then echo "Sparat."; exit 0; fi
            echo "Push avvisad (försök $i) – hämtar senaste och slår ihop igen."
            sleep 3
          done
          echo "Kunde inte spara efter flera försök."; exit 1

      - name: Larm om körningen misslyckades
        if: failure()
        env:
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${HA_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "$HA_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"title\":\"Bostadsvakt: körningen misslyckades\",\"message\":\"En körning gick fel. Kolla loggen: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\",\"url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
              > /dev/null
          fi
