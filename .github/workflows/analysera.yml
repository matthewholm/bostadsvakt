name: Analysera annons

# Startas från kontrollpanelen (eller Actions-fliken) med en Hemnet-länk.
# Kör hela analysen på det huset och pushar resultatet till mobilen.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Länk till annonsen (hemnet.se/bostad/...)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  analysera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Analysera annonsen
        env:
          ANNONS_URL: ${{ inputs.url }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/analysera.js

      - name: Spara i galleriet
        run: |
          if ! git diff --quiet data/; then
            git config user.name "bostadsvakt-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "Spara analyserad bostad i galleriet"
            git pull --rebase
            git push
          fi
