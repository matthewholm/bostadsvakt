name: Analysera annons

# Startas från Actions-fliken med en Hemnet-länk. Den gamla kontrollpanelen
# hade ett formulär för det här; Alva har inget ännu.
# Kör hela analysen på det huset och pushar resultatet till mobilen.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Länk till annonsen (hemnet.se/bostad/...)"
        required: true
        type: string

# Ingen contents: write behövs längre – husflödet postas till Alva, inget
# committas till repot av den här workflowen.
concurrency:
  # Delad grupp med Bostadsvakt: två körningar som båda läser Alvas feed
  # och sedan skriver tillbaka sin egen fullständiga vy får aldrig gå
  # samtidigt, annars vinner den som råkar bli klar sist och tystar den andra.
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  analysera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Analysera annonsen
        env:
          ANNONS_URL: ${{ inputs.url }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALVA_URL: ${{ secrets.ALVA_URL }}
          ALVA_INGEST_TOKEN: ${{ secrets.ALVA_INGEST_TOKEN }}
        run: node src/analysera.js
