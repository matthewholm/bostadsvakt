name: Analysera annons

# Startas från kontrollpanelen (eller Actions-fliken) med en Hemnet-länk.
# Kör hela analysen på det huset och pushar resultatet till mobilen.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Länk till annonsen (hemnet.se/bostad/...)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  analysera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Analysera annonsen
        env:
          ANNONS_URL: ${{ inputs.url }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node src/analysera.js

      - name: Spara i galleriet
        run: |
          cp data/traffar.json /tmp/mina-traffar.json
          git config user.name "bostadsvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node src/merge.js /tmp/mina-traffar.json
            git add data/
            if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
            git commit -m "Spara analyserad bostad i galleriet"
            if git push; then echo "Sparat."; exit 0; fi
            echo "Push avvisad (försök $i) – hämtar senaste och slår ihop igen."
            sleep 3
          done
          echo "Kunde inte spara efter flera försök."; exit 1
