name: Analysera annons

# Startas av klistra-in-sidan när en länk klistras in (eller för hand från
# Actions-fliken). Har sidan skickat med själva annonsen ligger den som
# data/annons.html i bostadsvakt-data, och tas bort när resultatet sparats.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Länk till annonsen (hemnet.se/bostad/... eller booli.se/annons/...)"
        required: true
        type: string

concurrency:
  group: bostadsvakt
  cancel-in-progress: false

jobs:
  analysera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: matthewholm/bostadsvakt-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data-repo

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Analysera annonsen
        env:
          ANNONS_URL: ${{ inputs.url }}
          RESROBOT_API_KEY: ${{ secrets.RESROBOT_API_KEY }}
          HA_WEBHOOK_URL: ${{ secrets.HA_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/analysera.js

      - name: Spara i galleriet
        working-directory: data-repo
        run: |
          cp data/traffar.json /tmp/mina-traffar.json
          if [ -f data/annons.html ]; then touch /tmp/annons-last; fi
          # Annonsens uppgifter och bildgranskning läggs ovanpå den senaste
          # husuppgifter.json av merge.js; deltafilen committas aldrig.
          if [ -f data/husuppgifter-nya.json ]; then mv data/husuppgifter-nya.json /tmp/nya-husuppgifter.json; fi
          git config user.name "bostadsvakt-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node ../src/merge.js /tmp/mina-traffar.json "" "" /tmp/nya-husuppgifter.json
            # Husflödet byggs om här också, så att huset syns i Alva direkt
            # och inte först vid nästa bevakningskörning.
            node ../src/sida.js
            if [ -f /tmp/annons-last ]; then git rm -q --ignore-unmatch data/annons.html; fi
            git add data/
            if git diff --cached --quiet; then echo "Inget nytt att spara."; exit 0; fi
            git commit -m "Spara analyserad bostad i galleriet"
            if git push; then echo "Sparat."; exit 0; fi
            echo "Push avvisad (försök $i) – hämtar senaste och slår ihop igen."
            sleep 3
          done
          echo "Kunde inte spara efter flera försök."; exit 1
